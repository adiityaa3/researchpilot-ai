
services:
  ai-research-agent:
    build: .
    container_name: ai-research-agent

    ports:
      - "8000:8000"

    env_file:
      - .env

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  streamlit-ui:
    build: .
    container_name: ai-research-agent-ui

    command: >
      streamlit run app/streamlit_app.py
      --server.address=0.0.0.0
      --server.port=8501

    ports:
      - "8501:8501"

    environment:
      API_URL: http://ai-research-agent:8000

    depends_on:
      - ai-research-agent

    restart: unless-stopped
